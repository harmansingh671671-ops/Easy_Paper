services:
  - type: web
    name: easy-paper-backend
    env: python
    region: singapore # or ohio, frankfurt, etc.
    plan: free
    buildCommand: cd server && pip install -r requirements.txt
    startCommand: cd server && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SCALAR_DOCS
        value: "true"
      - key: ALLOW_ORIGINS
        sync: false # User must update this after deploying frontend
      - key: GEMINI_API_KEYS
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
